# Nombre del workflow (aparece en la pestaña Actions de GitHub)
name: CI

# ¿Cuándo se ejecuta?
on:
  push:
    branches: [main]         # cada push a main
  pull_request:
    branches: [main]         # cada PR hacia main

# Trabajos (jobs) que se ejecutan en paralelo
jobs:
  # Job principal: tests y linting
  test:
    # Sistema operativo donde corre
    runs-on: ubuntu-latest

    # Estrategia: probar múltiples versiones de Python
    strategy:
      matrix:
        python-version: ["3.12"]

    # Pasos secuenciales dentro del job
    steps:
      # 1. Descargar el código del repositorio
      - uses: actions/checkout@v4

      # 2. Instalar la versión de Python indicada
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Instalar dependencias del proyecto
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Generar datos de prueba (para que los tests tengan datos)
      - name: Generate test data
        run: python scripts/generate_test_data.py

      # 5. Ejecutar linter (ruff) sobre el código fuente
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ --output-format=github

      # 6. Ejecutar tests con pytest
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --cov=src --cov-report=term-missing